<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #06070a; --card: rgba(18,19,24,.78); --line: rgba(255,255,255,.12); --txt: #f6f2ea; --dim: #b3ada2; --campo: rgba(255,255,255,.06); }
  @media (prefers-color-scheme: light) { :root { --bg: #f3f1ec; --card: rgba(255,255,255,.88); --line: rgba(32,24,12,.14); --txt: #17140f; --dim: #5c564b; --campo: #fff; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 20px; color: var(--txt); font: 500 15px "Manrope", system-ui, sans-serif;
    background: radial-gradient(900px 520px at 50% 18%, rgba(255,102,0,.22), transparent 62%), radial-gradient(700px 480px at 85% 95%, rgba(245,196,0,.12), transparent 60%), var(--bg); }
  main { width: min(420px, 100%); padding: 34px 28px 26px; text-align: center; border-radius: 26px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(22px); box-shadow: 0 40px 90px -30px rgba(0,0,0,.6); }
  .pin { width: 58px; height: 58px; filter: drop-shadow(0 8px 22px rgba(255,102,0,.55)); }
  h1 { margin: 12px 0 2px; font: 800 26px "Sora", sans-serif; letter-spacing: -.02em; }
  .sub { margin: 0 0 22px; color: var(--dim); font-size: 12.5px; letter-spacing: .04em; }
  .campo { position: relative; }
  input[type=password], input[type=text] { width: 100%; height: 50px; padding: 0 48px 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--campo); color: var(--txt); font: 600 15px "Manrope", sans-serif; }
  input:focus { outline: none; border-color: #ff7a1a; box-shadow: 0 0 0 4px rgba(255,122,26,.2); }
  .olho { position: absolute; right: 6px; top: 6px; width: 38px; height: 38px; border: 0; border-radius: 10px; background: transparent; color: var(--dim); cursor: pointer; font-size: 17px; }
  label.lembrar { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 14px 0 16px; color: var(--dim); font-size: 12.5px; cursor: pointer; }
  button.entrar { width: 100%; height: 50px; border: 0; border-radius: 14px; cursor: pointer; color: #fff; font: 800 15px "Sora", sans-serif; letter-spacing: .02em; background: linear-gradient(135deg, #ff9a2e, #ff5a00); box-shadow: 0 14px 30px -10px rgba(255,90,0,.8); }
  button.entrar:disabled { opacity: .6; cursor: default; }
  #msg { min-height: 20px; margin-top: 14px; font-size: 13px; font-weight: 700; color: #ff8a7a; }
  .nota { margin: 14px 0 0; color: var(--dim); font-size: 11.5px; line-height: 1.5; }
</style>
</head>

<script>
(function () {
  var P = JSON.parse(document.getElementById("gx-dados").textContent), msg = document.getElementById("msg"), btn = document.getElementById("ok"), campo = document.getElementById("senha"), CH = "gxAcesso";
  function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  async function abrir(senha) {
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
    var chave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.s), iterations: P.i, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.v) }, chave, b64(P.c)));
  }
  function mostrar(html) { document.open(); document.write(html); document.close(); }
  async function entrar(senha, lembrar, auto) {
    if (!window.crypto || !crypto.subtle) { msg.textContent = "Este navegador não permite abrir a página (é preciso endereço https)."; return; }
    senha = String(senha).trim().normalize("NFC"); btn.disabled = true; msg.style.color = ""; msg.textContent = auto ? "" : "Abrindo…";
    try { var html = await abrir(senha); try { if (lembrar) localStorage.setItem(CH, senha); else localStorage.removeItem(CH); } catch (e) {} mostrar(html); }
    catch (e) { btn.disabled = false; if (auto) { try { localStorage.removeItem(CH); } catch (x) {} return; } msg.textContent = "Senha incorreta."; campo.select(); }
  }
  document.getElementById("f").addEventListener("submit", function (ev) { ev.preventDefault(); if (campo.value.trim()) entrar(campo.value, document.getElementById("lembrar").checked, false); });
  document.getElementById("olho").addEventListener("click", function () { campo.type = campo.type === "password" ? "text" : "password"; });
  try { var salva = localStorage.getItem(CH); if (salva) { document.getElementById("lembrar").checked = true; entrar(salva, true, true); } } catch (e) {}
})();
</script>
